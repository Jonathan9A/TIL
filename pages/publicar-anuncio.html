<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar an&uacute;ncio | The Iron Legacy</title>
    <link href="../public/style.css" rel="stylesheet"/>
</head>
<body>
    <header class="header">
        <div class="wrap">
            <a class="logo" href="../public/index.html">THE IRON<span>LEGACY</span></a>
            <nav>
                <a href="anuncios.html">Pe&ccedil;as</a>
                <a href="veiculos.html">Ve&iacute;culos</a>
                <a href="alertas.html">Alertas</a>
                <a href="perfil.html">Perfil</a>
            </nav>
        </div>
    </header>
    <main class="wrap">
        <div class="heading">
            <p class="eyebrow">VENDA SUA PE&Ccedil;A</p>
            <h1>Publicar an&uacute;ncio</h1>
            <p class="muted">Preencha as informa&ccedil;&otilde;es para disponibilizar sua pe&ccedil;a.</p>
        </div>
        <form class="publish">
            <section class="panel">
                <h2>Informa&ccedil;&otilde;es da pe&ccedil;a</h2>
                <label>Nome da pe&ccedil;a</label>
                <input placeholder="Ex.: Carburador Weber 40"/>
                <label>Categoria</label>
                <select>
                    <option>Selecione</option>
                    <option>Motor</option>
                    <option>Carroceria</option>
                    <option>El&eacute;trica</option>
                </select>
                <label>Descri&ccedil;&atilde;o</label>
                <textarea placeholder="Descreva a pe&ccedil;a..." rows="7"></textarea>
                <div class="grid">
                    <div>
                        <label>Condi&ccedil;&atilde;o</label>
                        <select>
                            <option>Usada</option>
                            <option>Nova</option>
                        </select>
                    </div>
                    <div>
                        <label>Pre&ccedil;o</label>
                        <input placeholder="0,00" type="number"/>
                    </div>
                </div>
            </section>
            <section class="panel">
                <h2>Compatibilidade</h2>
                <label>Marca</label>
                <select>
                    <option>Chevrolet</option>
                    <option>Volkswagen</option>
                    <option>Ford</option>
                </select>
                <label>Modelo</label>
                <input placeholder="Ex.: Opala"/>
                <div class="grid">
                    <input placeholder="Ano inicial"/>
                    <input placeholder="Ano final"/>
                </div>
                <button class="primary">Publicar an&uacute;ncio</button>
            </section>
        </form>
    </main>
</body>
</html>
